# 92K 反向代理示例(nginx) — 支持子路径 https://域名/92kebi/ (与推送链接一致)
# 用法: sudo cp deploy/nginx.92kebi.conf /etc/nginx/conf.d/92kebi.conf
#       sudo nginx -t && sudo systemctl reload nginx
# 若域名根路径直连, 把下方两个 location 中 /92kebi/ 改为 / 即可(去掉 ^~ /92kebi/ 改 root 方式)
server {
    listen 80;
    server_name 你的域名或服务器IP;   # 例: wangchaoqun.top

    # 无尾斜杠时补一个(避免 /92kebi 裸地址 404)
    location = /92kebi {
        return 301 /92kebi/;
    }

    # 子路径部署: 前端/接口都在 /92kebi/ 下(前端构建产物使用相对路径, 天然兼容子路径)
    location ^~ /92kebi/ {
        proxy_pass http://127.0.0.1:8720/;   # 末尾 / 会去掉 /92kebi/ 前缀转发给应用
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /92kebi/;   # 供后端推导微信推送“点击直达”链接(代码无绝对地址)
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # 根路径健康检查(便于监控; 推送链接里的页面走 /92kebi/)
    location = /92kebi/api/health {
        proxy_pass http://127.0.0.1:8720/api/health;
    }
}
